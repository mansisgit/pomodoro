<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tomato Timer Wallpaper</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#111;overflow:hidden;color:#f7f0e8;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.panel{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(560px,94vw);padding:16px 18px;border-radius:16px;background:rgba(20,10,10,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,220,200,.16);display:grid;gap:12px;transition:opacity .5s,transform .5s}
.locked .panel{opacity:0;transform:translate(-50%,30px);pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
button{font:inherit;font-size:14px;color:#f7f0e8;background:rgba(255,255,255,.08);border:1px solid rgba(255,220,200,.2);padding:8px 14px;border-radius:9px;cursor:pointer}
button:hover{background:rgba(255,255,255,.16)}button.on{background:#c62419;border-color:#ff7a63}button.go{background:#e2372a;border-color:#ff9a88;font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid #ff7a63;outline-offset:2px}
label{font-size:13px;opacity:.85;display:flex;gap:8px;align-items:center}
input[type=range]{flex:1;min-width:140px;accent-color:#e2372a}
select{font:inherit;font-size:14px;color:#f7f0e8;background:rgba(255,255,255,.08);border:1px solid rgba(255,220,200,.2);border-radius:9px;padding:7px 10px}option{color:#111}
.clock{font-size:26px;font-weight:200;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.hint{font-size:12px;opacity:.6}
.lockbtn,.sndbtn{position:fixed;top:18px;right:18px;width:42px;height:42px;padding:0;border-radius:50%;display:grid;place-items:center;transition:opacity .6s;background:rgba(20,10,10,.55)}
.sndbtn{right:70px}.locked .lockbtn,.locked .sndbtn{opacity:.12}.locked .lockbtn:hover,.locked .sndbtn:hover{opacity:.8}.muted .w{display:none}.muted .sndbtn svg{opacity:.55}
.lockbtn svg,.sndbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.locked .open,body:not(.locked) .shut{display:none}

/* glass theme: frosted white with tomato red */
.panel{background:linear-gradient(160deg,rgba(255,255,255,.74),rgba(255,236,230,.56));backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid rgba(255,255,255,.75);box-shadow:0 14px 44px rgba(70,8,4,.38),inset 0 1px 0 rgba(255,255,255,.95);color:#4a0f0b}
button{color:#4a0f0b;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9);box-shadow:0 1px 3px rgba(90,10,6,.18)}
button:hover{background:rgba(255,255,255,.92)}
button.on,button.go{color:#fff;background:linear-gradient(#f0513f,#c2201a);border-color:rgba(255,255,255,.65);box-shadow:0 2px 8px rgba(194,32,26,.45)}
select{color:#4a0f0b;background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.9);box-shadow:0 1px 3px rgba(90,10,6,.15)}
input[type=range],input[type=checkbox]{accent-color:#d02a1f}
label{opacity:1;font-weight:500}
.clock{color:#7a1410;font-weight:300}
.lockbtn,.sndbtn{color:#c2201a;background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(70,8,4,.3)}
.tag{position:relative;height:38px;overflow:hidden;display:grid;place-items:center;font:italic 500 18px Georgia,"Times New Roman",serif;color:#4a0a07;font-weight:600;text-shadow:0 0 8px rgba(255,255,255,.95),0 1px 0 rgba(255,255,255,.9);letter-spacing:.01em}


/* glass v2: clear, low-opacity, black text */
.panel{background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,.13));backdrop-filter:blur(20px) saturate(1.35) brightness(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.35) brightness(1.3);
  border:1px solid rgba(255,255,255,.5);box-shadow:0 10px 34px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(255,255,255,.18);color:#000}
button,select{color:#000;border-radius:999px;background:linear-gradient(rgba(255,255,255,.44),rgba(255,255,255,.16));border:1px solid rgba(255,255,255,.6);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.75),inset 0 -2px 5px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.16)}
button:hover{background:linear-gradient(rgba(255,255,255,.62),rgba(255,255,255,.28))}
button.on,button.go{color:#000;background:linear-gradient(rgba(255,125,105,.65),rgba(226,55,42,.5));border-color:rgba(255,255,255,.6);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -2px 5px rgba(120,10,5,.25),0 2px 8px rgba(200,30,20,.35)}
label,.clock{color:#000}
.clock{font-weight:300}
.lockbtn,.sndbtn{color:#c2201a;background:linear-gradient(rgba(255,255,255,.46),rgba(255,255,255,.18));border:1px solid rgba(255,255,255,.65);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.75),inset 0 -2px 5px rgba(0,0,0,.12),0 4px 12px rgba(0,0,0,.25)}
.tag{height:50px;margin-bottom:-12px;padding-bottom:14px;color:#000;text-shadow:0 0 8px rgba(255,255,255,.55)}





/* softer button edges, new tagline font */
button,select{background:linear-gradient(rgba(255,255,255,.34),rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.28);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.3),inset 0 -2px 5px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.16)}
button:hover{background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.2))}
button.on,button.go{border-color:rgba(255,255,255,.32);box-shadow:inset 0 1px 1px rgba(255,255,255,.32),inset 0 -2px 5px rgba(120,10,5,.28),0 2px 8px rgba(200,30,20,.3)}
.lockbtn,.sndbtn{border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 1px rgba(255,255,255,.32),inset 0 -2px 5px rgba(0,0,0,.14),0 4px 12px rgba(0,0,0,.25)}
.tag{height:34px;margin:0;padding:0;overflow:visible;font:italic 500 21px "Playfair Display",Georgia,"Times New Roman",serif;letter-spacing:.01em;color:#000}

.hud{position:fixed;bottom:20px;right:20px;z-index:5;min-width:176px;padding:11px 20px 12px;border-radius:18px;text-align:center;pointer-events:none;color:#000;
  background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.14));backdrop-filter:blur(20px) saturate(1.35) brightness(1.25);-webkit-backdrop-filter:blur(20px) saturate(1.35) brightness(1.25);
  border:1px solid rgba(255,255,255,.5);box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(255,255,255,.18);transition:bottom .5s}
.hud .vis{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;letter-spacing:.06em;padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid rgba(0,0,0,.14)}
.hud .vis svg{width:18px;height:18px;fill:none;stroke:#c2201a;stroke-width:1.8;stroke-linecap:round}
.hud .vis b{font-size:18px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.hud .vis span{opacity:.7}
.hud .big{font-size:40px;font-weight:300;letter-spacing:.06em;font-variant-numeric:tabular-nums;line-height:1.1}
@media(max-width:1000px){body:not(.locked) .hud{bottom:312px}}

</style></head>
<body>
<canvas id="cv"></canvas>
<div class="hud" id="hud">
  <div class="vis"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17.5" cy="9" r="2.4"/><path d="M17 13.6c2.6.2 4.5 2 4.5 4.6"/></svg><b id="users">…</b><span>visitors</span></div>
  <div class="big" id="hudTime">25:00</div>
</div>
<button class="sndbtn" id="snd" aria-label="Sound on or off"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="w" d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12"/></svg></button>
<button class="lockbtn" id="lock" aria-label="Lock or unlock">
  <svg class="shut" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
  <svg class="open" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 017-2"/></svg>
</button>
<div class="panel">
  <div class="row" style="justify-content:center"><span class="clock" id="clock">25:00</span></div>
  <div class="row"><div class="row" id="presets"></div><label style="flex:1">Minutes <input type="range" id="slider" min="1" max="60" value="25"> <b id="val">25</b></label></div>
  <div class="row"><label>Background sound <select id="track"></select></label></div>
  <div class="row sp"><div class="row"><button class="go" id="start">Start</button><button id="reset">Reset</button></div></div>
  <div class="tag" id="tag"><span>You can just do things</span></div>
</div>

const $=id=>document.getElementById(id);
const CX=611,R=221,AP=24.6*Math.PI/180,K=14.4*Math.PI/180,W=1200,H=896;   // dial geometry measured from the photo
const yTop=a=>294.2+56.5*Math.cos(a-15*Math.PI/180);
let base=null;
const img=new Image(); img.onload=()=>{
  // wipe the printed 20 / 25 / ticks by blending the red above and below the band
  base=document.createElement('canvas'); base.width=W; base.height=H; const g=base.getContext('2d'); g.drawImage(img,0,0);
  const id=g.getImageData(0,0,W,H), D=id.data, O=new Uint8ClampedArray(D);
  const mean=(x,ya,yb)=>{let r=0,gg=0,b=0,n=0;for(let dx=-3;dx<=3;dx++)for(let y=ya;y<=yb;y++){const i=(y*W+x+dx)*4;r+=O[i];gg+=O[i+1];b+=O[i+2];n++;}return[r/n,gg/n,b/n];};
  for(let x=396;x<=828;x++){
    const a=Math.asin((x-CX)/R), y0=Math.round(yTop(a)-40), y1=Math.round(yTop(a)+22);
    const A=mean(x,y0-3,y0-1), B=mean(x,y1+1,y1+3);
    for(let y=y0;y<=y1;y++){ const t=(y-y0)/(y1-y0), i=(y*W+x)*4, n=(Math.random()-.5)*5;
      for(let c=0;c<3;c++) D[i+c]=A[c]+(B[c]-A[c])*t+n; }
  }
  g.putImageData(id,0,0); buildExt(); requestAnimationFrame(frame);
}; img.src=IMG;

const cv=$('cv'), ctx=cv.getContext('2d');
function fit(){ const d=devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d; }
let ext=null;
function buildExt(){            // photo stays fixed in the centre; the sides continue its light softly, so the look is the same at any window size
  if(!base) return;
  const E=Math.max(100,Math.ceil(((innerWidth/(innerHeight/H)-W)/2+60)/50)*50);
  if(ext&&ext.E===E) return;
  const mk=(w,h)=>{ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }, PV=100, F=70;
  const strip=x0=>{                                   // tone of the outer edge, smoothed top to bottom (no stripes)
    const t=mk(1,H); t.getContext('2d').drawImage(base,x0,0,16,H,0,0,1,H);
    const u=mk(64,H+2*PV), q=u.getContext('2d'); q.drawImage(t,0,0,1,1,0,0,64,PV); q.drawImage(t,0,0,1,H,0,PV,64,H); q.drawImage(t,0,H-1,1,1,0,H+PV,64,PV);
    const v=mk(64,H+2*PV), r=v.getContext('2d'); r.filter='blur(26px)'; r.drawImage(u,0,0); return v; };
  const c=mk(W+2*E,H), g=c.getContext('2d');
  g.drawImage(strip(0),32,PV,1,H,0,0,E+F+20,H); g.drawImage(strip(W-16),32,PV,1,H,E+W-F-20,0,E+F+20,H);
  const ph=mk(W,H), q=ph.getContext('2d'); q.drawImage(base,0,0); q.globalCompositeOperation='destination-in';     // photo edges melt into the sides
  const fg=q.createLinearGradient(0,0,W,0); fg.addColorStop(0,'rgba(0,0,0,0)'); fg.addColorStop(F/W,'#000'); fg.addColorStop(1-F/W,'#000'); fg.addColorStop(1,'rgba(0,0,0,0)');
  q.fillStyle=fg; q.fillRect(0,0,W,H); g.drawImage(ph,E,0);
  const dim=(x0,x1)=>{ const gr=g.createLinearGradient(x0,0,x1,0); gr.addColorStop(0,'rgba(6,4,4,0)'); gr.addColorStop(.45,'rgba(6,4,4,.5)'); gr.addColorStop(1,'rgba(6,4,4,.86)'); g.fillStyle=gr; };
  const xl=E+F/2, xr=E+W-F/2, span=Math.min(240,xl-20);                          // the fade starts at the photo's own edge, so every window size looks the same
  dim(xl,xl-span); g.fillRect(0,0,xl,H); dim(xr,xr+span); g.fillRect(xr,0,W+2*E-xr,H);
  const n=mk(128,128), nq=n.getContext('2d'), id=nq.createImageData(128,128);                                          // fine grain so it reads as photo, not flat colour
  for(let i=0;i<id.data.length;i+=4){ id.data[i]=id.data[i+1]=id.data[i+2]=Math.random()*255; id.data[i+3]=255; }
  nq.putImageData(id,0,0); g.save(); g.globalAlpha=.07; g.fillStyle=g.createPattern(n,'repeat'); g.fillRect(0,0,E,H); g.fillRect(E+W,0,E,H); g.restore();
  ext={c,E};
}

let running=false,endAt=0,remain=S[S.mode]*60000,locked=false,ringUntil=0,disp=remain/60000;
const save=()=>localStorage.setItem('tomato',JSON.stringify(S)), total=()=>S[S.mode]*60000;

function setMode(md){S.mode=md;save();running=false;remain=total();$('slider').value=S[md];$('val').textContent=S[md];$('start').textContent='Start';}
function chime(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[660,880,990].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=c.currentTime+i*.28;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.9);o.start(t);o.stop(t+1);});}catch(e){}}
function toggle(){if(running){remain=Math.max(0,endAt-Date.now());running=false;}else{if(remain<=0)remain=total();endAt=Date.now()+remain;running=true;}$('start').textContent=running?'Pause':'Start';}
function finish(){chime();setTimeout(chime,1300);setTimeout(chime,2600);ringUntil=performance.now()+3500;running=false;
  if(S.auto){setMode(S.mode==='focus'?'break':'focus');toggle();}else{remain=total();$('start').textContent='Start';}}
function setLock(v){locked=v;document.body.classList.toggle('locked',v);if(v&&!running)toggle();}
$('lock').onclick=()=>setLock(!locked);
$('slider').oninput=e=>setMinutes(+e.target.value);
$('presets').onclick=e=>{if(e.target.dataset.m)setMinutes(+e.target.dataset.m);};

$('start').onclick=toggle;$('reset').onclick=()=>{running=false;remain=total();$('start').textContent='Start';};

addEventListener('keydown',e=>{if(e.target.type==='range')return;
  if(e.key==='l'||e.key==='L')setLock(!locked);
  else if(e.code==='Space'){e.preventDefault();toggle();}
  else if(e.key==='f'||e.key==='F')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();});
setMode(S.mode);


/* ---- background sound: everything is synthesized in the browser, nothing to license ---- */
let AC=null, master=null, rev=null, cur=null, CT=null;
const mf=n=>440*Math.pow(2,(n-69)/12);
const later=(T,fn,ms)=>{ if(!T.dead) T.t.push(setTimeout(()=>{ if(!T.dead) fn(); },ms)); };
const BQ=(type,f)=>{ const b=AC.createBiquadFilter(); b.type=type; b.frequency.value=f; return b; };
function noise(kind,dest){ const n=AC.sampleRate*4, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0); let l=0;
  for(let i=0;i<n;i++){ const w=Math.random()*2-1; if(kind==='brown'){ l=(l+.02*w)/1.02; d[i]=l*3.5; } else d[i]=w*.5; }
  const src=AC.createBufferSource(); src.buffer=b; src.loop=true; src.connect(dest); src.start(); CT.srcs.push(src); }
function lfo(freq,depth,param){ const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=freq; g.gain.value=depth; o.connect(g); g.connect(param); o.start(); CT.srcs.push(o); }
function tone(bus,f,t,peak,dur,type='sine',att=.01){ const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=f; o.connect(g); g.connect(bus);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+att); g.gain.exponentialRampToValueAtTime(.0005,t+dur); o.start(t); o.stop(t+dur+.1); }
const TR={
  piano(bus,T){ const ch=[[48,55,59,64],[45,52,55,60],[41,48,52,57],[43,50,55,59]], pe=[72,74,76,79,81,84]; let i=0;
    const pad=()=>{ const t=AC.currentTime; ch[i++%4].forEach(n=>[-5,5].forEach(dt=>{ const o=AC.createOscillator(), g=AC.createGain(), f=BQ('lowpass',900);
      o.type='triangle'; o.frequency.value=mf(n); o.detune.value=dt; o.connect(f); f.connect(g); g.connect(bus);
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.035,t+2.5); g.gain.linearRampToValueAtTime(0,t+8.2); o.start(t); o.stop(t+8.3); })); later(T,pad,8000); };
    const note=()=>{ const f=mf(pe[Math.random()*6|0]), t=AC.currentTime; tone(bus,f,t,.05,2.6); tone(bus,f*2,t,.012,1.2); later(T,note,1200+Math.random()*2800); };
    pad(); later(T,note,2500); },
  rain(bus,T){ const hp=BQ('highpass',900), lp=BQ('lowpass',7000), g=AC.createGain(); g.gain.value=.16; noise('white',hp); hp.connect(lp); lp.connect(g); g.connect(bus);
    const r=BQ('lowpass',350), rg=AC.createGain(); rg.gain.value=.5; noise('brown',r); r.connect(rg); rg.connect(bus);
    const drop=()=>{ tone(bus,1800+Math.random()*2500,AC.currentTime,.015,.06); later(T,drop,60+Math.random()*260); }; drop(); },
  ocean(bus,T){ const lp=BQ('lowpass',700), g=AC.createGain(); g.gain.value=.25; noise('brown',lp); lp.connect(g); g.connect(bus); lfo(.11,.2,g.gain); lfo(.11,400,lp.frequency);
    const bp=BQ('bandpass',2500), fg=AC.createGain(); fg.gain.value=.05; noise('white',bp); bp.connect(fg); fg.connect(bus); lfo(.11,.04,fg.gain); },
  birds(bus,T){ const bp=BQ('bandpass',2800), lg=AC.createGain(); lg.gain.value=.03; noise('white',bp); bp.connect(lg); lg.connect(bus);
    const air=BQ('lowpass',400), ag=AC.createGain(); ag.gain.value=.15; noise('brown',air); air.connect(ag); ag.connect(bus);
    const chirp=(t,f0)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f0*1.5,t+.09); o.frequency.exponentialRampToValueAtTime(f0*1.1,t+.16);
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.035,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+.17); o.connect(g); g.connect(bus); o.start(t); o.stop(t+.2); };
    const song=()=>{ const f=2200+Math.random()*2200, n=2+(Math.random()*4|0), t=AC.currentTime; for(let i=0;i<n;i++) chirp(t+i*.2,f*(1+(i%2)*.12)); later(T,song,2500+Math.random()*6000); };
    later(T,song,800); },
  bowls(bus,T){ const ns=[48,53,55,60,64];
    const hit=()=>{ const f=mf(ns[Math.random()*5|0]), t=AC.currentTime; [[1,.05],[2.76,.02],[5.4,.008]].forEach(([r,p])=>{ tone(bus,f*r,t,p,9,'sine',.02); tone(bus,f*r*1.003,t,p*.8,9,'sine',.02); }); later(T,hit,6000+Math.random()*4000); };
    const drone=()=>{ const t=AC.currentTime; tone(bus,mf(36),t,.03,28,'sine',4); tone(bus,mf(43),t,.02,28,'sine',5); later(T,drone,24000); };
    drone(); hit(); },
  rainpiano(bus,T){ TR.rain(bus,T); TR.piano(bus,T); }
};
const TRACKS=[['piano','Calm piano'],['rain','Soft rain'],['ocean','Ocean waves'],['birds','Forest birds'],['bowls','Singing bowls'],['rainpiano','Rain + piano'],['off','No background sound']];
function setTrack(name){
  if(!AC) return;
  if(cur){ const o=cur; o.T.dead=true; o.T.t.forEach(clearTimeout); o.bus.gain.setTargetAtTime(0,AC.currentTime,.4);
    setTimeout(()=>{ o.T.srcs.forEach(x=>{try{x.stop();}catch(e){}}); o.bus.disconnect(); },2000); cur=null; }
  if(name==='off'||!TR[name]) return;
  const bus=AC.createGain(); bus.gain.value=0; bus.connect(master); bus.connect(rev); bus.gain.setTargetAtTime(.55,AC.currentTime,.8);
  const T={dead:false,t:[],srcs:[]}; CT=T; TR[name](bus,T); cur={T,bus};
}
function startAudio(){
  if(AC){ if(AC.state==='suspended')AC.resume(); return; }
  if(!S.sound) return;
  AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=.8; master.connect(AC.destination);
  const len=AC.sampleRate*2.6, ir=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){ const d=ir.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3); }
  rev=AC.createConvolver(); rev.buffer=ir; const rg=AC.createGain(); rg.gain.value=.5; rev.connect(rg); rg.connect(master);
  setTrack(S.track);
}
$('track').innerHTML=TRACKS.map(([v,n])=>`<option value="${v}">${n}</option>`).join(''); $('track').value=S.track;
$('track').onchange=e=>{ S.track=e.target.value; if(S.track!=='off'&&!S.sound){ S.sound=true; document.body.classList.remove('muted'); }
  save(); const had=!!AC; startAudio(); if(master) master.gain.setTargetAtTime(S.sound?.8:0,AC.currentTime,.3); if(had) setTrack(S.track); };
addEventListener('pointerdown',startAudio); addEventListener('keydown',startAudio);
document.body.classList.toggle('muted',!S.sound);
$('snd').onclick=()=>{ S.sound=!S.sound; save(); document.body.classList.toggle('muted',!S.sound); startAudio(); if(master) master.gain.setTargetAtTime(S.sound?.8:0,AC.currentTime,.3); };


/* floating dust: carried by gusts, catches the sunlight */
const PT=Array.from({length:70},()=>{const big=Math.random()<.2; return {x:Math.random()*1300-100,y:Math.random()*896,k:.4+Math.random()*1.2,f:.3+Math.random()*.9,g:.2+Math.random()*.6,ph:Math.random()*6.3,r:big?5+Math.random()*5:1+Math.random()*1.8,a:big?.05+Math.random()*.05:.25+Math.random()*.35};});

/* ---- visitor counter: counts each browser once, via /api/visitors on Vercel ---- */
async function visitors(first){
  const el=$('users'), seen=localStorage.getItem('tomato_seen'), count=first&&!seen;
  const local=location.protocol==='file:'||/^(localhost|127\.|\[::1\])/.test(location.hostname);
  const set=n=>{ el.textContent=Number(n).toLocaleString(); if(count) localStorage.setItem('tomato_seen','1'); };
  try{ const r=await fetch('/api/visitors',{method:count?'POST':'GET'}), j=await r.json(); if(j.count!=null) return set(j.count); }catch(e){}   // your own database, if connected
  if(!local){ try{ const ns='tomato-timer-'+location.hostname.replace(/[^a-z0-9]/gi,'-').toLowerCase().slice(0,40);                            // otherwise a free public counter
    const r=await fetch(`https://abacus.jasoncameron.dev/${count?'hit':'get'}/${ns}/visitors`), j=await r.json(); if(j.value!=null) return set(j.value); }catch(e){} }
  if(el.textContent==='…') el.textContent='–';
}
visitors(true); setInterval(()=>visitors(false),60000);

/* ---- draw: photo stays untouched, only the dial band moves ---- */
let last=performance.now(), aw=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(running){remain=endAt-Date.now();if(remain<=0){remain=0;finish();}}
  const v0=remain/60000; disp=running?v0:disp+(v0-disp)*(1-Math.exp(-dt*6));   // smooth twist when the time is changed
  const s=Math.ceil(remain/1000), txt=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  $('clock').textContent=txt; $('hudTime').textContent=txt; document.title=(running?txt+' · ':'')+'Tomato Timer';
  const d=devicePixelRatio||1, w=innerWidth, h=innerHeight, tt=now/1000, lv=S.live, sc=(h/H)*(1+(lv?.035+.012*Math.sin(tt*.13):0)),
        ox=(w-W*sc)/2+(lv?(Math.sin(tt*.21)*10+Math.sin(tt*.53)*2)*sc:0), oy=(h-H*sc)/2+(lv?Math.cos(tt*.17)*6*sc:0);
  ctx.setTransform(d,0,0,d,0,0); ctx.imageSmoothingQuality='high'; buildExt(); ctx.drawImage(ext.c,ox-ext.E*sc,oy,ext.c.width*sc,H*sc);
  ctx.setTransform(d*sc,0,0,d*sc,d*ox,d*oy);
  const shake=now<ringUntil?Math.sin(now/1000*60)*.006*Math.min(1,(ringUntil-now)/1200):0;
  aw+=((running?1:0)-aw)*(1-Math.exp(-dt*2));
  const dv=disp+(S.live?aw*(Math.sin(tt*.9)*.25+Math.sin(tt*2.3)*.05):0);      // dial glides gently back and forth while it runs
  ctx.filter=`blur(${.45*sc}px)`;
  for(let m=Math.max(0,Math.floor(dv)-9);m<=Math.min(60,Math.ceil(dv)+6);m++){
    const a=AP+(m-dv)*K+shake; if(Math.abs(a)>1.45)continue;
    const c=Math.cos(a), x=CX+R*Math.sin(a), yt=yTop(a), sl=-56.5*Math.sin(a-.2618)/(R*c), n=Math.hypot(sl,1);
    const al=Math.max(.3,Math.min(.95,.5+(x-430)/500))*Math.pow(c,.6), L=m%5?18:20;
    ctx.strokeStyle=`rgba(247,240,232,${al})`; ctx.lineWidth=4.6*c+.5;
    ctx.beginPath(); ctx.moveTo(x,yt); ctx.lineTo(x-sl/n*L,yt+L/n); ctx.stroke();
    if(m%5===0&&m>0){ ctx.save(); ctx.translate(x,yt-21); ctx.rotate(Math.atan(sl)*.35); ctx.scale(c,1);
      ctx.font='600 41px Helvetica,Arial,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle=`rgba(247,240,232,${al})`; ctx.fillText(String(m),0,0); ctx.restore(); }
  }
  ctx.filter='none';
  if(S.live){
    ctx.save(); ctx.globalCompositeOperation='lighter';
    const gl=ctx.createRadialGradient(770,285,0,770,285,120); gl.addColorStop(0,`rgba(255,240,220,${.05+.04*Math.sin(tt*.7)})`); gl.addColorStop(1,'rgba(255,240,220,0)');
    ctx.fillStyle=gl; ctx.fillRect(600,150,340,270);
    const wind=14+26*(.5+.5*Math.sin(tt*.27+1.3))*(.6+.4*Math.sin(tt*.9)), xmin=-ox/sc-100, xmax=(w-ox)/sc+100;
    if(!PT.i){ PT.i=1; PT.forEach(q=>q.x=xmin+Math.random()*(xmax-xmin)); }
    for(const p of PT){
      p.x+=(wind*p.k+Math.sin(tt*p.f+p.ph)*9)*dt; p.y+=(Math.sin(tt*p.g+p.ph)*7-2*p.k)*dt;
      if(p.x>xmax)p.x=xmin; if(p.y<-20)p.y=916; if(p.y>916)p.y=-20;
      ctx.fillStyle=`rgba(255,238,215,${p.a*(.55+.45*Math.sin(tt*p.f*1.7+p.ph))})`; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
    }
    ctx.globalCompositeOperation='source-over'; ctx.setTransform(d,0,0,d,0,0);
    ctx.fillStyle=`rgba(0,0,0,${.03*(.5+.5*Math.sin(tt*.11))})`; ctx.fillRect(0,0,w,h);   // a cloud slowly passing the sun
    ctx.restore();
  }
  requestAnimationFrame(frame);
}
